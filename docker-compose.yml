services:
  qmk:
    build: .
    environment:
      # Object tree on a Docker volume (not Dropbox bind mount, not ephemeral /tmp)
      QMK_BUILD_DIR: /qmk-build
    volumes:
      # Forked vial-qmk (git submodule) — must be initialized on the host first
      - ./vial-qmk:/workspace/vial-qmk
      # Built UF2 lands here
      - ./out:/workspace/out
      # Persist .o files across runs so rebuilds are incremental
      - qmk-build:/qmk-build
    # Override command for a shell: docker compose run --rm qmk shell
    # Default CMD is "compile"

volumes:
  qmk-build:
